LEPerGameDetection.ini (copy next to the .asi file) - all keys optional,
compiled defaults already contain the project owner's application IDs.

[presence]
; Discord application IDs (one per game) from https://discord.com/developers/applications
; - LE1 app must be named "Mass Effect", LE2 app "Mass Effect 2", LE3 app "Mass Effect 3"
client_id_le1=1568689342417739806
client_id_le2=1568722277154160791
client_id_le3=1568722427175895060

; 1 = mod active, 0 = off
enabled=1

; 1 = open a debug console window while the game runs; a log is always written to
; %LOCALAPPDATA%\MELEDiscordRPC regardless of this key
debug=0

; 1 = show the playtime timer under the game name; 0 = game name + icon only
show_timer=1
